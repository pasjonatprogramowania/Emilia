<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Zadanie 4: Zwierzęce Kształty i Cienie | EkoOdkrywcy 1–3</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style>
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: #0f172a;
            }
            h1,
            h2,
            h3,
            .font-display {
                font-family: 'Nunito', sans-serif;
            }
        </style>
    </head>
    <body class="text-slate-100 antialiased">
        <div id="root"></div>

        <script type="text/babel">
            const { useState, useRef } = React;

            const HIDDEN_ANIMALS = [
                {
                    id: 'dzieciol',
                    name: 'Dzięcioł duży',
                    icon: '🐦',
                    layer: 'Pnie i korony drzew',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/Great_spotted_woodpecker_%28Dendrocopos_major%29_male_Drenthe.jpg/960px-Great_spotted_woodpecker_%28Dendrocopos_major%29_male_Drenthe.jpg',
                    credit: 'Charles J. Sharp',
                    license: 'CC BY-SA 4.0',
                    creditUrl: 'https://commons.wikimedia.org/wiki/File:Great_spotted_woodpecker_(Dendrocopos_major)_male_Drenthe.jpg',
                },
                {
                    id: 'sowa',
                    name: 'Sowa puszczyk',
                    icon: '🦉',
                    layer: 'Korony drzew',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/5/55/Strix_aluco_3_%28Martin_Mecnarowski%29.jpg',
                    credit: 'Martin Mecnarowski',
                    license: 'CC BY-SA 3.0',
                    creditUrl: 'https://commons.wikimedia.org/wiki/File:Strix_aluco_3_(Martin_Mecnarowski).jpg',
                },
                {
                    id: 'bobr',
                    name: 'Bóbr europejski',
                    icon: '🦫',
                    layer: 'Runo leśne i brzeg wody',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/c/cc/Beaver_pho34.jpg',
                    credit: 'Per Harald Olsen',
                    license: 'CC BY-SA 3.0',
                    creditUrl: 'https://commons.wikimedia.org/wiki/File:Beaver_pho34.jpg',
                },
                {
                    id: 'zebra',
                    name: 'Zebra (gość z sawanny)',
                    icon: '🦓',
                    layer: 'Zarośla i sawanna (poza polskim lasem)',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Equus_quagga_burchellii_-_Etosha%2C_2014.jpg/960px-Equus_quagga_burchellii_-_Etosha%2C_2014.jpg',
                    credit: 'Yathin S Krishnappa',
                    license: 'CC BY-SA 3.0',
                    creditUrl: 'https://commons.wikimedia.org/wiki/File:Equus_quagga_burchellii_-_Etosha,_2014.jpg',
                },
                {
                    id: 'borsuk',
                    name: 'Borsuk',
                    icon: '🦡',
                    layer: 'Ściółka i podziemie (nora)',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/European_badger_%28Meles_meles_taxus%29_Drenthe.jpg/960px-European_badger_%28Meles_meles_taxus%29_Drenthe.jpg',
                    credit: 'Charles J. Sharp',
                    license: 'CC BY-SA 4.0',
                    creditUrl: 'https://commons.wikimedia.org/wiki/File:European_badger_(Meles_meles_taxus)_Drenthe.jpg',
                },
            ];

            const LAYER_OPTIONS = ['Korony drzew', 'Pnie i korony drzew', 'Runo leśne i brzeg wody', 'Ściółka i podziemie (nora)', 'Zarośla i sawanna (poza polskim lasem)'];

            function App() {
                const [index, setIndex] = useState(0);
                const [foundIds, setFoundIds] = useState([]);
                const [selectedName, setSelectedName] = useState('');
                const [selectedLayer, setSelectedLayer] = useState('');
                const [quizFeedback, setQuizFeedback] = useState(null);
                const swipeStartX = useRef(null);

                const animal = HIDDEN_ANIMALS[index];
                const isFound = foundIds.includes(animal.id);

                const goTo = (nextIndex) => {
                    const total = HIDDEN_ANIMALS.length;
                    setIndex((nextIndex + total) % total);
                    setSelectedName('');
                    setSelectedLayer('');
                    setQuizFeedback(null);
                };

                const handlePointerUp = (clientX) => {
                    if (swipeStartX.current === null) return;
                    const dx = clientX - swipeStartX.current;
                    swipeStartX.current = null;
                    if (dx < -50) goTo(index + 1);
                    else if (dx > 50) goTo(index - 1);
                };

                const handleVerifyAnswer = (e) => {
                    e.preventDefault();
                    if (isFound) return;

                    if (selectedName === animal.id && selectedLayer === animal.layer) {
                        const next = [...foundIds, animal.id];
                        setFoundIds(next);
                        setQuizFeedback({ ok: true, msg: `Brawo! To ${animal.name} — ${animal.layer}.` });

                        if (next.length === HIDDEN_ANIMALS.length) {
                            try {
                                const saved = JSON.parse(localStorage.getItem('eko_odkrywcy_progress') || '{}');
                                saved['zadanie-4'] = true;
                                localStorage.setItem('eko_odkrywcy_progress', JSON.stringify(saved));
                            } catch (err) {}
                        }
                    } else {
                        setQuizFeedback({ ok: false, msg: 'Nie tym razem. Przyjrzyj się zdjęciu i pomyśl, gdzie to zwierzę żyje.' });
                    }
                };

                return (
                    <div className="min-h-screen flex flex-col">
                        {/* Header */}
                        <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
                            <div className="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
                                <a href="index.html" className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold text-sm transition">
                                    <span>←</span>
                                    <span>Powrót do menu</span>
                                </a>
                                <div className="flex items-center gap-2">
                                    <span className="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs font-extrabold">Zadanie 4 • Karta #8</span>
                                    <h1 className="text-base sm:text-lg font-black text-white">„Zwierzęce Kształty i Cienie”</h1>
                                </div>
                                <div className="px-3.5 py-1.5 rounded-xl bg-indigo-950 border border-indigo-700 text-indigo-200 text-xs sm:text-sm font-extrabold">
                                    🔦 Odkryto: {foundIds.length} / {HIDDEN_ANIMALS.length}
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                                {/* Left: Swipeable photo deck */}
                                <div className="lg:col-span-7 bg-slate-900 rounded-3xl p-4 border-2 border-slate-700 shadow-xl">
                                    <p className="text-xs sm:text-sm text-indigo-200 font-bold mb-3 px-1">👆 Przesuń palcem w bok, aby zobaczyć kolejne zwierzę</p>

                                    <div
                                        className="relative rounded-2xl overflow-hidden border-2 border-slate-700 bg-slate-950 touch-pan-y select-none"
                                        onPointerDown={(e) => { swipeStartX.current = e.clientX; }}
                                        onPointerUp={(e) => handlePointerUp(e.clientX)}
                                        onPointerCancel={() => { swipeStartX.current = null; }}
                                    >
                                        <img
                                            src={animal.photo}
                                            alt="Zwierzę w swoim naturalnym środowisku"
                                            draggable={false}
                                            className="w-full aspect-[4/3] object-cover"
                                        />

                                        <span className="absolute top-3 left-3 px-3 py-1 rounded-full bg-slate-950/80 text-slate-100 text-xs font-extrabold">
                                            Zdjęcie {index + 1} / {HIDDEN_ANIMALS.length}
                                        </span>

                                        {isFound && (
                                            <span className="absolute top-3 right-3 px-3 py-1 rounded-full bg-emerald-500 text-slate-950 text-xs font-black">✅ Odkryte</span>
                                        )}

                                        <button
                                            type="button"
                                            aria-label="Poprzednie zdjęcie"
                                            onClick={() => goTo(index - 1)}
                                            className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-slate-950/70 hover:bg-slate-950 text-white text-2xl leading-none"
                                        >
                                            ‹
                                        </button>
                                        <button
                                            type="button"
                                            aria-label="Następne zdjęcie"
                                            onClick={() => goTo(index + 1)}
                                            className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-slate-950/70 hover:bg-slate-950 text-white text-2xl leading-none"
                                        >
                                            ›
                                        </button>
                                    </div>

                                    <p className="mt-2 px-1 text-[11px] text-slate-400">
                                        Zdjęcie:{' '}
                                        <a href={animal.creditUrl} target="_blank" rel="noreferrer" className="underline hover:text-slate-200">
                                            {animal.credit}
                                        </a>{' '}
                                        ({animal.license}, Wikimedia Commons)
                                    </p>
                                </div>

                                {/* Right: Identification Form & Discovered List */}
                                <div className="lg:col-span-5 flex flex-col gap-5">
                                    {isFound ? (
                                        <div className="bg-slate-800 rounded-3xl p-6 border-2 border-emerald-500">
                                            <span className="inline-block px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-extrabold mb-2">✅ Gatunek rozpoznany</span>
                                            <h2 className="text-xl font-black text-white mb-1">{animal.name}</h2>
                                            <p className="text-sm text-slate-300 leading-relaxed mb-4">Żyje w warstwie: <strong className="text-emerald-300">{animal.layer}</strong>.</p>
                                            <button
                                                type="button"
                                                onClick={() => goTo(index + 1)}
                                                className="w-full py-3 px-4 rounded-xl bg-slate-100 hover:bg-white text-slate-900 font-black text-sm transition"
                                            >
                                                Następne zdjęcie →
                                            </button>
                                        </div>
                                    ) : (
                                        <form onSubmit={handleVerifyAnswer} className="bg-slate-800 rounded-3xl p-6 border-2 border-amber-400 shadow-xl">
                                            <span className="inline-block px-3 py-1 rounded-full bg-amber-400/20 text-amber-300 text-xs font-extrabold mb-2">🔦 Zgadnij, kogo widzisz</span>
                                            <h2 className="text-xl font-black text-white mb-4">Co to za zwierzę i gdzie żyje?</h2>

                                            <div className="space-y-3 mb-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-300 mb-1">1. Rozpoznane zwierzę:</label>
                                                    <select value={selectedName} onChange={(e) => setSelectedName(e.target.value)} required className="w-full rounded-xl bg-slate-900 border border-slate-600 text-white px-3.5 py-2.5 text-sm font-semibold focus:outline-none focus:border-amber-400">
                                                        <option value="">-- Wybierz zwierzę --</option>
                                                        {HIDDEN_ANIMALS.map((a) => (
                                                            <option key={a.id} value={a.id}>
                                                                {a.icon} {a.name}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-slate-300 mb-1">2. Warstwa lasu / środowisko:</label>
                                                    <select value={selectedLayer} onChange={(e) => setSelectedLayer(e.target.value)} required className="w-full rounded-xl bg-slate-900 border border-slate-600 text-white px-3.5 py-2.5 text-sm font-semibold focus:outline-none focus:border-amber-400">
                                                        <option value="">-- Wybierz warstwę lasu --</option>
                                                        {LAYER_OPTIONS.map((layer) => (
                                                            <option key={layer} value={layer}>
                                                                {layer}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>

                                            {quizFeedback && !quizFeedback.ok && <p className="text-xs font-bold text-rose-300 bg-rose-950/60 border border-rose-700 p-2.5 rounded-xl mb-3">⚠️ {quizFeedback.msg}</p>}

                                            <button type="submit" className="w-full py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm transition shadow-md">
                                                Sprawdź odpowiedź ✓
                                            </button>
                                        </form>
                                    )}

                                    {quizFeedback && quizFeedback.ok && (
                                        <div className="p-3 rounded-xl bg-emerald-900/60 border border-emerald-500 text-emerald-200 text-xs font-bold">🎉 {quizFeedback.msg}</div>
                                    )}

                                    {/* Discovered Animals Log */}
                                    <div className="bg-slate-800 rounded-3xl p-5 border-2 border-slate-700">
                                        <h3 className="text-sm font-black uppercase tracking-wider text-slate-400 mb-3">Księga odkrytych gatunków</h3>
                                        <div className="space-y-2.5">
                                            {HIDDEN_ANIMALS.map((a, i) => {
                                                const discovered = foundIds.includes(a.id);
                                                return (
                                                    <button
                                                        type="button"
                                                        key={a.id}
                                                        onClick={() => goTo(i)}
                                                        className={`w-full text-left p-3 rounded-2xl border flex items-center justify-between transition ${discovered ? 'bg-emerald-950/50 border-emerald-600 text-white' : 'bg-slate-900/60 border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-2xl">{discovered ? a.icon : '❓'}</span>
                                                            <div>
                                                                <p className="text-xs font-black">{discovered ? a.name : `Zagadka ${i + 1}`}</p>
                                                                <p className="text-[11px]">{discovered ? a.layer : 'Jeszcze nieodkryte'}</p>
                                                            </div>
                                                        </div>
                                                        {discovered && <span className="text-emerald-400 font-black text-xs">✅</span>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
    </body>
</html>
