<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title>Memory: Egzotyczne Zwierzęta | EkoOdkrywcy 1–3</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style>
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: #f0fdfa;
                max-width: 100%;
                overflow-x: hidden;
            }
            h1,
            h2,
            h3,
            .font-display {
                font-family: 'Nunito', sans-serif;
            }
            .card-flip {
                transition: transform 0.25s ease;
            }
            .card-flip:active {
                transform: scale(0.96);
            }
        </style>
    </head>
    <body class="text-slate-800 antialiased">
        <div id="root"></div>

        <script type="text/babel">
            const { useState } = React;

            const ANIMALS = [
                {
                    id: 'lew',
                    name: 'Lew afrykański',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/020_The_lion_king_Snyggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg/960px-020_The_lion_king_Snyggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg',
                },
                {
                    id: 'zyrafa',
                    name: 'Żyrafa',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Giraffe_Mikumi_National_Park.jpg/960px-Giraffe_Mikumi_National_Park.jpg',
                },
                {
                    id: 'slon',
                    name: 'Słoń afrykański',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/178_Male_African_bush_elephant_in_Etosha_National_Park_Photo_by_Giles_Laurent.jpg/960px-178_Male_African_bush_elephant_in_Etosha_National_Park_Photo_by_Giles_Laurent.jpg',
                },
                {
                    id: 'panda',
                    name: 'Panda wielka',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Grosser_Panda.JPG/960px-Grosser_Panda.JPG',
                },
                {
                    id: 'koala',
                    name: 'Koala',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Koala_climbing_tree.jpg/960px-Koala_climbing_tree.jpg',
                },
                {
                    id: 'flaming',
                    name: 'Flaming różowy',
                    photo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Flamingos_Laguna_Colorada.jpg/960px-Flamingos_Laguna_Colorada.jpg',
                },
            ];

            const buildDeck = () => {
                const cards = [];
                ANIMALS.forEach((animal) => {
                    cards.push({ key: `${animal.id}-photo`, animalId: animal.id, kind: 'photo', animal });
                    cards.push({ key: `${animal.id}-name`, animalId: animal.id, kind: 'name', animal });
                });
                for (let i = cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cards[i], cards[j]] = [cards[j], cards[i]];
                }
                return cards;
            };

            function App() {
                const [deck, setDeck] = useState(buildDeck);
                const [opened, setOpened] = useState([]);
                const [matched, setMatched] = useState([]);
                const [moves, setMoves] = useState(0);
                const [locked, setLocked] = useState(false);

                const isWon = matched.length === ANIMALS.length;

                const handleOpen = (index) => {
                    if (locked || matched.includes(deck[index].animalId)) return;
                    if (opened.includes(index) || opened.length === 2) return;

                    const next = [...opened, index];
                    setOpened(next);

                    if (next.length === 2) {
                        setMoves((prev) => prev + 1);
                        const [a, b] = next.map((i) => deck[i]);

                        if (a.animalId === b.animalId && a.kind !== b.kind) {
                            const nextMatched = [...matched, a.animalId];
                            setMatched(nextMatched);
                            setOpened([]);
                            if (nextMatched.length === ANIMALS.length) {
                                try {
                                    const parsed = JSON.parse(localStorage.getItem('eko_odkrywcy_progress') || '{}');
                                    const saved = parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
                                    saved['memory'] = true;
                                    localStorage.setItem('eko_odkrywcy_progress', JSON.stringify(saved));
                                } catch (err) {}
                            }
                        } else {
                            setLocked(true);
                            setTimeout(() => {
                                setOpened([]);
                                setLocked(false);
                            }, 900);
                        }
                    }
                };

                const restart = () => {
                    setDeck(buildDeck());
                    setOpened([]);
                    setMatched([]);
                    setMoves(0);
                    setLocked(false);
                };

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-white border-b border-teal-200 sticky top-0 z-30">
                            <div className="max-w-4xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                    ←
                                </a>
                                <div className="min-w-0 flex-1">
                                    <p className="text-[10px] font-extrabold uppercase tracking-wide text-teal-700 leading-none mb-1">Memory • Karta #11</p>
                                    <h1 className="text-sm sm:text-lg font-black text-slate-900 truncate leading-tight">Egzotyczne Zwierzęta</h1>
                                </div>
                                <span className="px-3 py-2 rounded-xl bg-teal-50 border border-teal-200 text-teal-800 text-xs font-extrabold shrink-0">
                                    Ruchy: {moves}
                                </span>
                            </div>
                        </header>

                        <main className="flex-1 max-w-4xl w-full mx-auto px-3 py-4 sm:px-4 sm:py-6">
                            <p className="text-xs sm:text-sm text-slate-600 mb-3">
                                Odkrywaj po dwie karty. Połącz <strong>zdjęcie</strong> zwierzęcia z jego <strong>nazwą</strong>.
                            </p>

                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 sm:gap-3">
                                {deck.map((card, index) => {
                                    const isRevealed = opened.includes(index) || matched.includes(card.animalId);
                                    const isMatched = matched.includes(card.animalId);

                                    return (
                                        <button
                                            key={card.key}
                                            onClick={() => handleOpen(index)}
                                            aria-label={isRevealed ? card.animal.name : 'Zakryta karta'}
                                            className={`card-flip relative w-full aspect-[3/4] rounded-2xl border-2 overflow-hidden flex items-center justify-center text-center ${
                                                isMatched
                                                    ? 'border-emerald-400 bg-emerald-50'
                                                    : isRevealed
                                                      ? 'border-teal-400 bg-white'
                                                      : 'border-teal-300 bg-gradient-to-br from-teal-500 to-emerald-600'
                                            }`}
                                        >
                                            {isRevealed ? (
                                                card.kind === 'photo' ? (
                                                    <img
                                                        src={card.animal.photo}
                                                        alt={card.animal.name}
                                                        loading="lazy"
                                                        draggable={false}
                                                        className="w-full h-full object-cover"
                                                    />
                                                ) : (
                                                    <span className="px-1.5 text-[11px] sm:text-sm font-black text-slate-900 leading-tight break-words">
                                                        {card.animal.name}
                                                    </span>
                                                )
                                            ) : (
                                                <span className="text-3xl sm:text-4xl select-none">🐾</span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>

                            {isWon && (
                                <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                                    <div className="w-full max-w-sm bg-white rounded-3xl p-6 border-2 border-emerald-300 shadow-2xl text-center animate-pop">
                                        <div className="text-5xl mb-2">🎉</div>
                                        <h2 className="text-xl font-black text-slate-900 mb-1">Memory ukończone!</h2>
                                        <p className="text-sm text-slate-600 mb-3">
                                            Wszystkie 6 par dopasowane w <strong>{moves}</strong> ruchach.
                                        </p>
                                        <p className="inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold mb-5">
                                            ✅ Zadanie zaliczone
                                        </p>
                                        <div className="flex flex-col gap-2.5">
                                            <button onClick={restart} className="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm transition">
                                                Zagraj ponownie
                                            </button>
                                            <a href="index.html" className="w-full py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition text-center">
                                                Wróć do menu
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!isWon && (
                                <button onClick={restart} className="mt-4 w-full sm:w-auto px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
                                    🔄 Nowa gra
                                </button>
                            )}

                            <p className="mt-6 text-[10px] leading-relaxed text-slate-400">
                                Zdjęcia: Giles Laurent (lew, słoń), Muhammad Mahdi Karim (żyrafa), J. Patrick Fischer (panda), Diliff (koala), Valdiney Pimenta (flaming) — Wikimedia Commons, licencje CC BY-SA / CC BY / GFDL.
                            </p>
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
    </body>
</html>
