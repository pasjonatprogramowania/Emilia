<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title>EkoOdkrywcy 1–3 | Interaktywna Pracownia Przyrodnicza</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style>
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: #f4f7f4;
            }
            h1, h2, h3, .font-display {
                font-family: 'Nunito', sans-serif;
            }
        </style>
    </head>
    <body class="text-slate-800 antialiased selection:bg-emerald-200 selection:text-emerald-950">
        <div id="root"></div>

        <script type="text/babel">
            const { useState, useEffect } = React;

            const TASKS = [
                {
                    id: 'zadanie-1',
                    badge: 'Zadanie 1 • Karta #5',
                    title: '„Czego brakuje w plecaku?”',
                    subtitle: 'Interaktywna walizka opiekuna',
                    description: 'Wylosuj zwierzę domowe lub gospodarskie i spakuj tylko bezpieczne oraz potrzebne rzeczy. Sprawdź, dlaczego czekolada lub mleko szkodzą!',
                    goal: 'Odpowiedzialność za zwierzęta i zdrowe nawyki żywieniowe',
                    href: 'zadanie-1.html',
                    accent: 'amber',
                    icon: '🎒',
                    tag: 'Drag & Drop',
                },
                {
                    id: 'zadanie-2',
                    badge: 'Zadanie 2 • Karta #6',
                    title: '„Budujemy Leśny Korytarz Życia”',
                    subtitle: 'Układanka przestrzenna / Korytarz',
                    description: 'Zbuduj zielone mosty (ekodukty), tunele dla płazów, liny dla wiewiórek oraz ekrany akustyczne nad ruchliwą trasą.',
                    goal: 'Ochrona siedlisk i migracja dzikich zwierząt',
                    href: 'zadanie-2.html',
                    accent: 'sky',
                    icon: '🦌',
                    tag: 'Mapa i Symulacja',
                },
                {
                    id: 'zadanie-3',
                    badge: 'Zadanie 3 • Karta #3',
                    title: '„Zbuduj Idealny Ekosystem”',
                    subtitle: 'Sandbox Przyrodniczy (3 sloty)',
                    description: 'Ułóż elementy ekosystemu (stare drzewo, kałuża z błotem, budka lęgowa, łąka, trawnik, lampa) i natychmiast badaj zależności, synergie oraz konflikty.',
                    goal: 'Myślenie przyczynowo-skutkowe i bioróżnorodność',
                    href: 'zadanie-3.html',
                    accent: 'emerald',
                    icon: '🌿',
                    tag: 'Sandbox 3D',
                },
                {
                    id: 'zadanie-4',
                    badge: 'Zadanie 4 • Karta #8',
                    title: '„Zwierzęce Kształty i Cienie”',
                    subtitle: 'Interaktywny detektor / Magiczna lupka',
                    description: 'Przesuwaj magiczną latarkę po nocnym lesie. Odkryj ukryte w zaroślach, na drzewach i pod ziemią zwierzęta.',
                    goal: 'Percepcja wzrokowa oraz warstwowa budowa lasu',
                    href: 'zadanie-4.html',
                    accent: 'indigo',
                    icon: '🔦',
                    tag: 'Latarka Canvas',
                },
                {
                    id: 'zadanie-5',
                    badge: 'Zadanie 5 • Karta #10',
                    title: '„Co je ten zwierzak?”',
                    subtitle: 'Koło fortuny ze smakołykami',
                    description: 'Zakręć cyfrowym kołem fortuny, wylosuj leśnego mieszkańca i skompletuj dla niego zdrowe menu ze stołu pełnego leśnych skarbów.',
                    goal: 'Świadome dokarmianie i naturalna dieta gatunków',
                    href: 'zadanie-5.html',
                    accent: 'rose',
                    icon: '🎡',
                    tag: 'Koło Fortuny',
                },
                {
                    id: 'zadanie-6',
                    badge: 'Zadanie 6 • Karta Podstawy',
                    title: '„Klucz Dychotomiczny Kręgowców”',
                    subtitle: 'Przewodnik po gromadach',
                    description: 'Poprowadź zwierzęta (wilk, bocian, jaszczurka, żaba, okoń) oraz gatunki mylące przez pytania TAK/NIE aż do poprawnej gromady (Ssaki, Ptaki, Gady, Płazy, Ryby).',
                    goal: 'Rozpoznawanie cech budowy i klasyfikacja kręgowców',
                    href: 'zadanie-6.html',
                    accent: 'teal',
                    icon: '🔍',
                    tag: 'Klucz TAK/NIE',
                },
                {
                    id: 'zadanie-7',
                    badge: 'Zadanie 7 • Gospodarstwo',
                    title: '„Zwierzęta Gospodarcze i Surowce”',
                    subtitle: 'Moduł rolniczo-gospodarski',
                    description: 'Dopasuj dla krów, świń, owiec i kur odpowiedniego samca, młode, miejsce życia oraz pozyskiwane surowce i produkty.',
                    goal: 'Zwierzęta gospodarskie i surowce pochodzenia zwierzęcego',
                    href: 'zadanie-7.html',
                    accent: 'amber',
                    icon: '🐄',
                    tag: 'Dopasowywanie',
                },
                {
                    id: 'memory',
                    badge: 'Zadanie 8 • Karta #11',
                    title: '„Memory: Egzotyczne Zwierzęta”',
                    subtitle: 'Dopasuj zdjęcie do nazwy gatunku',
                    description: 'Odkrywaj karty i połącz zdjęcie zwierzęcia z jego nazwą. Sześć par egzotycznych gatunków z całego świata do zapamiętania.',
                    goal: 'Pamięć wzrokowa i rozpoznawanie gatunków świata',
                    href: 'memory.html',
                    accent: 'teal',
                    icon: '🦁',
                    tag: 'Memory',
                },
            ];

            const ACCENT_MAP = {
                amber: {
                    border: 'border-amber-200 hover:border-amber-400',
                    pill: 'bg-amber-100 text-amber-800',
                    iconBg: 'bg-amber-50 text-amber-700 border-amber-200',
                    btn: 'bg-amber-600 hover:bg-amber-700 text-white shadow-amber-600/20',
                },
                sky: {
                    border: 'border-sky-200 hover:border-sky-400',
                    pill: 'bg-sky-100 text-sky-800',
                    iconBg: 'bg-sky-50 text-sky-700 border-sky-200',
                    btn: 'bg-sky-600 hover:bg-sky-700 text-white shadow-sky-600/20',
                },
                emerald: {
                    border: 'border-emerald-300 hover:border-emerald-500 ring-2 ring-emerald-500/15',
                    pill: 'bg-emerald-100 text-emerald-800',
                    iconBg: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    btn: 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/25',
                },
                indigo: {
                    border: 'border-indigo-200 hover:border-indigo-400',
                    pill: 'bg-indigo-100 text-indigo-800',
                    iconBg: 'bg-indigo-50 text-indigo-700 border-indigo-200',
                    btn: 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-600/20',
                },
                rose: {
                    border: 'border-rose-200 hover:border-rose-400',
                    pill: 'bg-rose-100 text-rose-800',
                    iconBg: 'bg-rose-50 text-rose-700 border-rose-200',
                    btn: 'bg-rose-600 hover:bg-rose-700 text-white shadow-rose-600/20',
                },
                teal: {
                    border: 'border-teal-200 hover:border-teal-400',
                    pill: 'bg-teal-100 text-teal-800',
                    iconBg: 'bg-teal-50 text-teal-700 border-teal-200',
                    btn: 'bg-teal-600 hover:bg-teal-700 text-white shadow-teal-600/20',
                },
            };

            const readProgress = () => {
                try {
                    const parsed = JSON.parse(localStorage.getItem('eko_odkrywcy_progress') || '{}');
                    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
                } catch (e) {
                    return {};
                }
            };

            function App() {
                const [completed, setCompleted] = useState({});

                useEffect(() => {
                    const syncProgress = () => setCompleted(readProgress());
                    syncProgress();
                    window.addEventListener('pageshow', syncProgress);
                    window.addEventListener('storage', syncProgress);
                    return () => {
                        window.removeEventListener('pageshow', syncProgress);
                        window.removeEventListener('storage', syncProgress);
                    };
                }, []);

                const completedCount = TASKS.filter((task) => Boolean(completed[task.id])).length;
                const allCompleted = completedCount === TASKS.length;
                const remainingTasks = TASKS.length - completedCount;

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-white/90 backdrop-blur-md border-b border-emerald-100 sticky top-0 z-30">
                            <div className="max-w-6xl mx-auto px-3 sm:px-6 py-2.5 sm:py-4 flex items-center justify-between gap-2 sm:gap-4">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <div className="w-9 h-9 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white flex items-center justify-center text-lg sm:text-2xl shadow-md shadow-emerald-600/20 shrink-0">🌍</div>
                                    <div className="min-w-0">
                                        <h1 className="text-base sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-none truncate">
                                            EkoOdkrywcy <span className="text-emerald-600">1–3</span>
                                        </h1>
                                        <p className="hidden sm:block text-xs sm:text-sm text-slate-500 font-medium mt-1">Interaktywna pracownia przyrodnicza</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 sm:gap-3 shrink-0">
                                    <a
                                        href={allCompleted ? 'quiz.html' : undefined}
                                        aria-label={allCompleted ? 'Quiz podsumowujący' : 'Quiz zablokowany — ukończ wszystkie zadania'}
                                        aria-disabled={!allCompleted}
                                        title={allCompleted ? 'Rozwiąż quiz podsumowujący' : `Zablokowany — zostało ${remainingTasks} zadań`}
                                        onClick={(e) => { if (!allCompleted) e.preventDefault(); }}
                                        className={`inline-flex items-center justify-center gap-2 px-3 sm:px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm ${
                                            allCompleted
                                                ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                                : 'bg-slate-200 text-slate-500 cursor-not-allowed'
                                        }`}
                                    >
                                        <span>{allCompleted ? '🧠' : '🔒'}</span>
                                        <span className="hidden sm:inline">Quiz Podsumowujący</span>
                                    </a>
                                    <div className="flex items-center gap-1.5 px-2.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs sm:text-sm font-semibold">
                                        <span>⭐</span>
                                        <span className="text-emerald-700 font-extrabold">
                                            {completedCount} / {TASKS.length}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10">
                            <section className="bg-gradient-to-br from-emerald-800 via-emerald-700 to-teal-800 rounded-3xl p-6 sm:p-10 text-white shadow-xl shadow-emerald-900/10 mb-10 relative overflow-hidden">
                                <div className="absolute -right-10 -bottom-10 text-[150px] opacity-10 select-none pointer-events-none">🌲</div>
                                <div className="max-w-2xl relative z-10">
                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 backdrop-blur text-emerald-100 text-xs font-bold uppercase tracking-wider mb-4">✨ Edukacja Wczesnoszkolna (Klasy 1–3)</span>
                                    <h2 className="text-2xl sm:text-4xl font-black leading-tight mb-3">Poznaj tajemnice przyrody przez interaktywne misje i eksperymenty!</h2>
                                    <p className="text-emerald-100/95 text-sm sm:text-base leading-relaxed mb-6">Ukończ wszystkie 8 zadań i misji, aby odblokować wielki Quiz Podsumowujący wiedzę przyrodniczą.</p>
                                    <div className="flex items-center gap-3">
                                        <a href="zadanie-3.html" className="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-white text-emerald-900 hover:bg-emerald-50 font-extrabold text-sm shadow-lg transition">
                                            <span>🌿</span>
                                            <span>Zadanie 3: Sandbox Ekosystemu</span>
                                        </a>
                                    </div>
                                </div>
                            </section>

                            <section aria-label="Lista zadań edukacyjnych">
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900">Misje do wykonania</h3>
                                    <span className="text-xs sm:text-sm text-slate-500 font-medium">8 modułów edukacyjnych</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {TASKS.map((task) => {
                                        const style = ACCENT_MAP[task.accent];
                                        const isDone = Boolean(completed[task.id]);

                                        return (
                                            <article key={task.id} className={`bg-white rounded-3xl border-2 ${style.border} p-6 flex flex-col justify-between shadow-sm hover:shadow-xl transition-all duration-200 hover:-translate-y-1`}>
                                                <div>
                                                    <div className="flex items-start justify-between gap-2 mb-4">
                                                        <span className={`inline-block px-3 py-1 rounded-full text-xs font-extrabold ${style.pill}`}>{task.badge}</span>
                                                        {isDone ? <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">✅ Zaliczone</span> : <span className="inline-block px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold">{task.tag}</span>}
                                                    </div>

                                                    <div className="flex items-center gap-3.5 mb-3">
                                                        <div className={`w-14 h-14 rounded-2xl border ${style.iconBg} flex items-center justify-center text-3xl shrink-0`}>{task.icon}</div>
                                                        <div>
                                                            <h4 className="text-lg font-black text-slate-900 leading-snug">{task.title}</h4>
                                                            <p className="text-xs font-bold text-slate-500">{task.subtitle}</p>
                                                        </div>
                                                    </div>

                                                    <p className="text-sm text-slate-600 leading-relaxed mb-4">{task.description}</p>

                                                    <div className="bg-slate-50 rounded-2xl p-3.5 border border-slate-100 mb-5">
                                                        <p className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Cel dydaktyczny</p>
                                                        <p className="text-xs font-semibold text-slate-700 leading-snug">{task.goal}</p>
                                                    </div>
                                                </div>

                                                <a href={task.href} className={`w-full py-3 px-4 rounded-xl font-extrabold text-sm text-center shadow-md transition flex items-center justify-center gap-2 ${style.btn}`}>
                                                    <span>Uruchom zadanie</span>
                                                    <span>→</span>
                                                </a>
                                            </article>
                                        );
                                    })}

                                    {/* Quiz card — always visible, locked until every task is done */}
                                    <article
                                        aria-disabled={!allCompleted}
                                        className={`relative bg-white rounded-3xl border-2 p-6 flex flex-col justify-between transition-all duration-200 ${
                                            allCompleted
                                                ? 'border-emerald-400 shadow-sm hover:shadow-xl hover:-translate-y-1'
                                                : 'border-slate-200 opacity-70 shadow-none'
                                        }`}
                                    >
                                        <div>
                                            <div className="flex items-start justify-between gap-2 mb-4">
                                                <span className={`inline-block px-3 py-1 rounded-full text-xs font-extrabold ${allCompleted ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}`}>
                                                    Quiz • Podsumowanie
                                                </span>
                                                <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold ${allCompleted ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}`}>
                                                    {allCompleted ? '🔓 Odblokowany' : '🔒 Zablokowany'}
                                                </span>
                                            </div>

                                            <div className="flex items-center gap-3.5 mb-3">
                                                <div className={`w-14 h-14 rounded-2xl border flex items-center justify-center text-3xl shrink-0 ${allCompleted ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200 grayscale'}`}>
                                                    {allCompleted ? '🧠' : '🔒'}
                                                </div>
                                                <div>
                                                    <h4 className={`text-lg font-black leading-snug ${allCompleted ? 'text-slate-900' : 'text-slate-500'}`}>Wielki Quiz Podsumowujący</h4>
                                                    <p className="text-xs font-bold text-slate-500">8 pytań ze wszystkich zadań</p>
                                                </div>
                                            </div>

                                            <p className={`text-sm leading-relaxed mb-4 ${allCompleted ? 'text-slate-600' : 'text-slate-500'}`}>
                                                {allCompleted
                                                    ? 'Wszystkie zadania ukończone! Sprawdź, ile pamiętasz z całej pracowni przyrodniczej.'
                                                    : `Ukończ wszystkie zadania, aby odblokować quiz. Zostało ${remainingTasks} z ${TASKS.length}.`}
                                            </p>

                                            <div className={`rounded-2xl p-3.5 border mb-5 ${allCompleted ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-100'}`}>
                                                <p className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Postęp odblokowania</p>
                                                <p className="text-xs font-semibold text-slate-700 leading-snug mb-2">{completedCount} / {TASKS.length} zadań ukończonych</p>
                                                <div className="h-2 rounded-full bg-slate-200 overflow-hidden">
                                                    <div className={`h-full transition-all ${allCompleted ? 'bg-emerald-500' : 'bg-slate-400'}`} style={{ width: `${Math.round((completedCount / TASKS.length) * 100)}%` }}></div>
                                                </div>
                                            </div>
                                        </div>

                                        {allCompleted ? (
                                            <a href="quiz.html" className="w-full py-3 px-4 rounded-xl font-extrabold text-sm text-center shadow-md transition flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white">
                                                <span>Rozwiąż quiz</span>
                                                <span>→</span>
                                            </a>
                                        ) : (
                                            <div aria-disabled="true" className="w-full py-3 px-4 rounded-xl font-extrabold text-sm text-center bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed">
                                                🔒 Zablokowany — ukończ zadania
                                            </div>
                                        )}
                                    </article>
                                </div>
                            </section>
                        </main>

                        <footer className="bg-white border-t border-slate-200 py-6 mt-12">
                            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
                                <p className="font-semibold">EkoOdkrywcy 1–3 • Platforma Przyrodnicza</p>
                                <div className="flex flex-wrap gap-3 font-bold text-slate-600">
                                    <a href="zadanie-1.html" className="hover:text-emerald-700">Zad. 1</a>
                                    <a href="zadanie-2.html" className="hover:text-emerald-700">Zad. 2</a>
                                    <a href="zadanie-3.html" className="hover:text-emerald-700">Zad. 3</a>
                                    <a href="zadanie-4.html" className="hover:text-emerald-700">Zad. 4</a>
                                    <a href="zadanie-5.html" className="hover:text-emerald-700">Zad. 5</a>
                                    <a href="zadanie-6.html" className="hover:text-emerald-700">Zad. 6</a>
                                    <a href="zadanie-7.html" className="hover:text-emerald-700">Zad. 7</a>
                                    <a href="memory.html" className="hover:text-emerald-700">Memory</a>
                                    <a href="quiz.html" className="hover:text-emerald-700">Quiz</a>
                                </div>
                            </div>
                        </footer>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
    </body>
</html>
