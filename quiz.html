<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title>Quiz podsumowujący | EkoOdkrywcy 1–3</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style>
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: #f4f7f4;
            }
            h1,
            h2,
            h3,
            .font-display {
                font-family: 'Nunito', sans-serif;
            }
        </style>
    </head>
    <body class="text-slate-800 antialiased">
        <div id="root"></div>

        <script type="text/babel">
            const { useState, useEffect } = React;

            const REQUIRED_MISSIONS = [
                { id: 'zadanie-1', name: 'Zadanie 1: Czego brakuje w plecaku?' },
                { id: 'zadanie-2', name: 'Zadanie 2: Leśny Korytarz Życia' },
                { id: 'zadanie-3', name: 'Zadanie 3: Sandbox Ekosystemu' },
                { id: 'zadanie-4', name: 'Zadanie 4: Zwierzęce Kształty i Cienie' },
                { id: 'zadanie-5', name: 'Zadanie 5: Co je ten zwierzak?' },
                { id: 'zadanie-6', name: 'Zadanie 6: Klucz Dychotomiczny Kręgowców' },
                { id: 'zadanie-7', name: 'Zadanie 7: Zwierzęta Gospodarcze i Surowce' },
                { id: 'memory', name: 'Zadanie 8: Memory Egzotyczne Zwierzęta' },
            ];

            const QUESTIONS = [
                {
                    id: 'q1',
                    text: 'Pies zjadł tabliczkę czekolady. Co robisz?',
                    options: [
                        { text: 'Czekam, aż samo przejdzie', correct: false },
                        { text: 'Jadę z nim do weterynarza', correct: true },
                        { text: 'Daję mu miskę mleka', correct: false },
                    ],
                    explanation: 'Czekolada zawiera teobrominę, która uszkadza serce i układ nerwowy psa.',
                },
                {
                    id: 'q2',
                    text: 'Co jest podstawą diety królika?',
                    options: [
                        { text: 'Siano', correct: true },
                        { text: 'Chleb', correct: false },
                        { text: 'Słodkie owoce', correct: false },
                    ],
                    explanation: 'Siano to około 80% jadłospisu królika — ściera zęby i utrzymuje trawienie.',
                },
                {
                    id: 'q3',
                    text: 'Co pozwala jeleniom bezpiecznie przejść nad autostradą?',
                    options: [
                        { text: 'Ekrany akustyczne', correct: false },
                        { text: 'Ekodukt, czyli zielony most', correct: true },
                        { text: 'Znak ostrzegawczy', correct: false },
                    ],
                    explanation: 'Ekodukt to szeroki most porośnięty trawą dla dużych ssaków.',
                },
                {
                    id: 'q4',
                    text: 'Po co zostawiamy w lesie stare, spróchniałe drzewo?',
                    options: [
                        { text: 'Daje dziuple, kryjówki i pokarm wielu gatunkom', correct: true },
                        { text: 'Nie ma żadnego znaczenia', correct: false },
                        { text: 'Służy tylko jako opał', correct: false },
                    ],
                    explanation: 'W martwym drewnie mieszkają puszczyki, nietoperze i setki owadów.',
                },
            ];

            function App() {
                const [progress, setProgress] = useState({});
                const [index, setIndex] = useState(0);
                const [selected, setSelected] = useState(null);
                const [score, setScore] = useState(0);
                const [finished, setFinished] = useState(false);

                useEffect(() => {
                    try {
                        const parsed = JSON.parse(localStorage.getItem('eko_odkrywcy_progress') || '{}');
                        setProgress(parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {});
                    } catch (e) {
                        setProgress({});
                    }
                }, []);

                const missingMissions = REQUIRED_MISSIONS.filter((m) => !progress[m.id]);
                // One mission may be skipped: 7 of 8 unlocks the quiz
                const isLocked = missingMissions.length > 1;

                if (isLocked) {
                    return (
                        <div className="min-h-screen flex flex-col">
                            <header className="bg-white border-b border-emerald-200">
                                <div className="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                    <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                        ←
                                    </a>
                                    <span className="flex-1 text-xs font-extrabold text-emerald-800">Quiz Podsumowujący</span>
                                </div>
                            </header>
                            <main className="flex-1 flex items-center justify-center px-4 py-10">
                                <div className="w-full max-w-xl bg-white rounded-3xl p-8 border-2 border-rose-200 shadow-sm text-center">
                                    <div className="text-6xl mb-3">🔒</div>
                                    <h2 className="text-2xl font-black text-slate-900 mb-2">Quiz jest zablokowany!</h2>
                                    <p className="text-sm text-slate-600 mb-6">Aby odblokować Wielki Quiz Podsumowujący, ukończ 7 z 8 misji (Zadania 1–7 oraz Memory) — jedno zadanie możesz pominąć.</p>
                                    <div className="space-y-2 text-left mb-6 bg-rose-50 p-4 rounded-2xl border border-rose-200">
                                        <p className="text-xs font-black uppercase text-rose-900 mb-2">Pozostałe do wykonania:</p>
                                        {missingMissions.map((m) => (
                                            <div key={m.id} className="text-xs font-bold text-rose-800 flex items-center gap-2">
                                                <span>❌</span>
                                                <span>{m.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <a href="index.html" className="inline-block py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm transition shadow">
                                        Wróć do listy zadań →
                                    </a>
                                </div>
                            </main>
                        </div>
                    );
                }

                const question = QUESTIONS[index];
                const isAnswered = selected !== null;

                const handleAnswer = (optionIndex) => {
                    if (isAnswered) return;
                    setSelected(optionIndex);
                    if (question.options[optionIndex].correct) setScore((prev) => prev + 1);
                };

                const handleNext = () => {
                    if (index === QUESTIONS.length - 1) {
                        setFinished(true);
                        return;
                    }
                    setIndex((prev) => prev + 1);
                    setSelected(null);
                };

                if (finished) {
                    return (
                        <div className="min-h-screen flex flex-col">
                            <header className="bg-white border-b border-emerald-200">
                                <div className="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                    <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                        ←
                                    </a>
                                    <span className="flex-1 text-xs font-extrabold text-emerald-800">Wynik Quizu</span>
                                </div>
                            </header>
                            <main className="flex-1 flex items-center justify-center px-4 py-10">
                                <div className="w-full max-w-xl bg-white rounded-3xl p-8 border-2 border-emerald-200 shadow-sm text-center">
                                    <div className="text-6xl mb-3">🏆</div>
                                    <h2 className="text-2xl font-black text-slate-900 mb-1">
                                        Twój wynik: {score} / {QUESTIONS.length}
                                    </h2>
                                    <p className="text-sm text-slate-600 mb-6">Gratulacje! Ukończyłeś Wielki Quiz Podsumowujący.</p>
                                    <a href="index.html" className="inline-block py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm transition">
                                        Wróć do menu głównego
                                    </a>
                                </div>
                            </main>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-white border-b border-emerald-200 sticky top-0 z-30">
                            <div className="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                    ←
                                </a>
                                <span className="flex-1 text-xs font-extrabold text-emerald-800 truncate">Quiz Podsumowujący</span>
                                <span className="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-extrabold shrink-0">{score} pkt</span>
                            </div>
                        </header>

                        <main className="flex-1 max-w-3xl w-full mx-auto px-3 py-4 sm:px-4 sm:py-10">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 border-2 border-emerald-200 shadow-sm">
                                <h2 className="text-xl sm:text-2xl font-black text-slate-900 mb-5">{question.text}</h2>
                                <div className="space-y-2.5 mb-6">
                                    {question.options.map((option, i) => {
                                        const chosen = selected === i;
                                        const revealCorrect = isAnswered && option.correct;
                                        const revealWrong = isAnswered && chosen && !option.correct;
                                        return (
                                            <button key={i} onClick={() => handleAnswer(i)} disabled={isAnswered} className={`w-full text-left px-4 py-3 rounded-2xl border-2 font-bold text-sm transition ${revealCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-900' : revealWrong ? 'bg-rose-50 border-rose-400 text-rose-900' : isAnswered ? 'bg-slate-50 border-slate-200 text-slate-500' : 'bg-slate-50 hover:bg-emerald-50 border-slate-200 hover:border-emerald-300 text-slate-800'}`}>
                                                {option.text}
                                            </button>
                                        );
                                    })}
                                </div>

                                {isAnswered && <div className="mb-6 p-3.5 rounded-2xl border bg-emerald-50 border-emerald-300 text-emerald-900 text-sm font-semibold">💡 {question.explanation}</div>}

                                <button onClick={handleNext} disabled={!isAnswered} className={`w-full py-3.5 px-4 rounded-2xl font-black text-sm transition ${isAnswered ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                    {index === QUESTIONS.length - 1 ? 'Zobacz wynik' : 'Następne pytanie →'}
                                </button>
                            </div>
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
    </body>
</html>
