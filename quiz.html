<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title>Quiz podsumowujący | EkoOdkrywcy 1–3</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style>
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: #f4f7f4;
            }
            h1,
            h2,
            h3,
            .font-display {
                font-family: 'Nunito', sans-serif;
            }
        </style>
    </head>
    <body class="text-slate-800 antialiased">
        <div id="root"></div>

        <script type="text/babel">
            const { useState } = React;

            const QUESTIONS = [
                {
                    id: 'q1',
                    text: 'Pies zjadł tabliczkę czekolady. Co robisz?',
                    options: [
                        { text: 'Czekam, aż samo przejdzie', correct: false },
                        { text: 'Jadę z nim do weterynarza', correct: true },
                        { text: 'Daję mu miskę mleka', correct: false },
                    ],
                    explanation: 'Czekolada zawiera teobrominę, która uszkadza serce i układ nerwowy psa. Nie ma na nią domowego sposobu — potrzebny jest weterynarz.',
                },
                {
                    id: 'q2',
                    text: 'Co jest podstawą diety królika?',
                    options: [
                        { text: 'Siano', correct: true },
                        { text: 'Chleb', correct: false },
                        { text: 'Słodkie owoce', correct: false },
                    ],
                    explanation: 'Siano to około 80% jadłospisu królika — ściera zęby i utrzymuje trawienie w dobrej formie.',
                },
                {
                    id: 'q3',
                    text: 'Co pozwala jeleniom bezpiecznie przejść nad autostradą?',
                    options: [
                        { text: 'Ekrany akustyczne', correct: false },
                        { text: 'Ekodukt, czyli zielony most', correct: true },
                        { text: 'Znak ostrzegawczy', correct: false },
                    ],
                    explanation: 'Ekodukt to szeroki most porośnięty trawą i krzewami. Dla dużych ssaków wygląda jak przedłużenie lasu.',
                },
                {
                    id: 'q4',
                    text: 'Żaby wędrują do rzeki na tarło. Co ułatwia im przejście pod drogą?',
                    options: [
                        { text: 'Wilgotny tunel (przepust) pod jezdnią', correct: true },
                        { text: 'Liny rozpięte w koronach drzew', correct: false },
                        { text: 'Smycz i obroża', correct: false },
                    ],
                    explanation: 'Płazy potrzebują wilgotnego przejścia nisko przy ziemi — tunel pod drogą chroni je przed kołami i wysychaniem.',
                },
                {
                    id: 'q5',
                    text: 'Sarna ma na głowie parostki. Co to oznacza?',
                    options: [
                        { text: 'To poroże, które zrzuca zimą i odrasta mu na wiosnę', correct: true },
                        { text: 'To rogi jak u krowy, których nigdy nie zrzuca', correct: false },
                        { text: 'To kostne uszy do nasłuchiwania dźwięków', correct: false },
                    ],
                    explanation: 'Parostki to pełne poroże samca sarny. Zrzuca je zimą, a na wiosnę wyrasta nowe. Rogi (np. u krowy) są puste w środku i rosną przez całe życie.',
                },
                {
                    id: 'q6',
                    text: 'Gdzie mieszka borsuk?',
                    options: [
                        { text: 'W norze wykopanej pod korzeniami', correct: true },
                        { text: 'W dziupli wysoko w koronie', correct: false },
                        { text: 'W gnieździe z gałęzi na łące', correct: false },
                    ],
                    explanation: 'Borsuk kopie rozległe nory w ściółce i pod korzeniami drzew — tam śpi, wychowuje młode i chowa się przed niebezpieczeństwem.',
                },
                {
                    id: 'q7',
                    text: 'Po co zostawiamy w lesie stare, spróchniałe drzewo?',
                    options: [
                        { text: 'Daje dziuple, kryjówki i pokarm wielu gatunkom', correct: true },
                        { text: 'Nie ma żadnego znaczenia', correct: false },
                        { text: 'Służy tylko jako opał', correct: false },
                    ],
                    explanation: 'W martwym drewnie mieszkają puszczyki, nietoperze, jelonek rogacz i setki owadów. Usunięcie go to jak wyburzenie całego osiedla.',
                },
                {
                    id: 'q8',
                    text: 'Czym karmić kaczki nad stawem?',
                    options: [
                        { text: 'Chlebem', correct: false },
                        { text: 'Ziarnem zbóż i pokrojonymi warzywami', correct: true },
                        { text: 'Słonymi chipsami', correct: false },
                    ],
                    explanation: 'Chleb zakwasza żołądek ptaków wodnych i powoduje „anielskie skrzydło”. Najlepsze są ziarna, warzywa i płatki owsiane.',
                },
            ];

            function App() {
                const [index, setIndex] = useState(0);
                const [selected, setSelected] = useState(null);
                const [score, setScore] = useState(0);
                const [answers, setAnswers] = useState([]);
                const [finished, setFinished] = useState(false);

                const question = QUESTIONS[index];
                const isAnswered = selected !== null;

                const handleAnswer = (optionIndex) => {
                    if (isAnswered) return;
                    setSelected(optionIndex);
                    const correct = question.options[optionIndex].correct;
                    if (correct) setScore((prev) => prev + 1);
                    setAnswers((prev) => [...prev, { id: question.id, correct }]);
                };

                const handleNext = () => {
                    const isLast = index === QUESTIONS.length - 1;
                    if (isLast) {
                        setFinished(true);
                        if (score / QUESTIONS.length >= 0.6) {
                            try {
                                const saved = JSON.parse(localStorage.getItem('eko_odkrywcy_progress') || '{}');
                                saved['quiz'] = true;
                                localStorage.setItem('eko_odkrywcy_progress', JSON.stringify(saved));
                            } catch (err) {}
                        }
                        return;
                    }
                    setIndex((prev) => prev + 1);
                    setSelected(null);
                };

                const handleRestart = () => {
                    setIndex(0);
                    setSelected(null);
                    setScore(0);
                    setAnswers([]);
                    setFinished(false);
                };

                if (finished) {
                    const percent = Math.round((score / QUESTIONS.length) * 100);
                    return (
                        <div className="min-h-screen flex flex-col">
                            <header className="bg-white border-b border-emerald-200">
                                <div className="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                    <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                        ←
                                    </a>
                                    <span className="flex-1 text-xs font-extrabold text-emerald-800">Quiz podsumowujący</span>
                                </div>
                            </header>
                            <main className="flex-1 flex items-center justify-center px-4 py-10">
                                <div className="w-full max-w-xl bg-white rounded-3xl p-8 border-2 border-emerald-200 shadow-sm text-center">
                                    <div className="text-6xl mb-3">{percent >= 80 ? '🏆' : percent >= 60 ? '👏' : '💪'}</div>
                                    <h2 className="text-2xl font-black text-slate-900 mb-1">Twój wynik: {score} / {QUESTIONS.length}</h2>
                                    <p className="text-sm text-slate-600 mb-6">
                                        {percent >= 80 ? 'Świetnie! Jesteś prawdziwym znawcą polskiej przyrody.' : percent >= 60 ? 'Dobra robota! Kilka odpowiedzi jeszcze ćwiczymy.' : 'Przejrzyj zadania jeszcze raz i spróbuj ponownie.'}
                                    </p>
                                    <div className="space-y-2 text-left mb-6">
                                        {QUESTIONS.map((q, i) => {
                                            const answer = answers.find((a) => a.id === q.id);
                                            return (
                                                <div key={q.id} className={`p-3 rounded-2xl border text-xs font-semibold flex items-start gap-2 ${answer && answer.correct ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                                                    <span>{answer && answer.correct ? '✅' : '❌'}</span>
                                                    <span>{i + 1}. {q.text}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <button onClick={handleRestart} className="flex-1 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm transition">
                                            Zagraj ponownie
                                        </button>
                                        <a href="index.html" className="flex-1 py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-black text-sm transition text-center">
                                            Wróć do zadań
                                        </a>
                                    </div>
                                </div>
                            </main>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-white border-b border-emerald-200 sticky top-0 z-30">
                            <div className="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                    ←
                                </a>
                                <span className="flex-1 text-xs font-extrabold text-emerald-800 truncate">Quiz podsumowujący</span>
                                <span className="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-extrabold shrink-0">{score} pkt</span>
                            </div>
                        </header>

                        <main className="flex-1 max-w-3xl w-full mx-auto px-3 py-4 sm:px-4 sm:py-10">
                            <div className="flex items-center justify-between mb-3 text-xs font-bold text-slate-500">
                                <span>Pytanie {index + 1} z {QUESTIONS.length}</span>
                                <span>{Math.round(((index) / QUESTIONS.length) * 100)}%</span>
                            </div>
                            <div className="h-2 rounded-full bg-slate-200 mb-6 overflow-hidden">
                                <div className="h-full bg-emerald-500 transition-all" style={{ width: `${(index / QUESTIONS.length) * 100}%` }} />
                            </div>

                            <div className="bg-white rounded-3xl p-6 sm:p-8 border-2 border-emerald-200 shadow-sm">
                                <h2 className="text-xl sm:text-2xl font-black text-slate-900 mb-5">{question.text}</h2>

                                <div className="space-y-2.5">
                                    {question.options.map((option, i) => {
                                        const chosen = selected === i;
                                        const revealCorrect = isAnswered && option.correct;
                                        const revealWrong = isAnswered && chosen && !option.correct;
                                        return (
                                            <button
                                                key={i}
                                                onClick={() => handleAnswer(i)}
                                                disabled={isAnswered}
                                                className={`w-full text-left px-4 py-3 rounded-2xl border-2 font-bold text-sm transition ${
                                                    revealCorrect
                                                        ? 'bg-emerald-50 border-emerald-500 text-emerald-900'
                                                        : revealWrong
                                                          ? 'bg-rose-50 border-rose-400 text-rose-900'
                                                          : isAnswered
                                                            ? 'bg-slate-50 border-slate-200 text-slate-500'
                                                            : 'bg-slate-50 hover:bg-emerald-50 border-slate-200 hover:border-emerald-300 text-slate-800'
                                                }`}
                                            >
                                                {option.text}
                                            </button>
                                        );
                                    })}
                                </div>

                                {isAnswered && (
                                    <div className={`mt-5 p-3.5 rounded-2xl border text-sm font-semibold ${question.options[selected].correct ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-amber-50 border-amber-300 text-amber-900'}`}>
                                        {question.options[selected].correct ? '✅ Dobrze! ' : '⚠️ Nie tak. '}
                                        {question.explanation}
                                    </div>
                                )}

                                <button
                                    onClick={handleNext}
                                    disabled={!isAnswered}
                                    className={`mt-5 w-full py-3.5 px-4 rounded-2xl font-black text-sm transition ${isAnswered ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                >
                                    {index === QUESTIONS.length - 1 ? 'Zobacz wynik' : 'Następne pytanie →'}
                                </button>
                            </div>
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
    </body>
</html>
