<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title>Zadanie 3: Zbuduj Idealny Ekosystem (Sandbox) | EkoOdkrywcy 1–3</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style>
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: #ecfdf5;
            }
            h1, h2, h3, .font-display {
                font-family: 'Nunito', sans-serif;
            }
            @keyframes popIn {
                0% { transform: scale(0.92); opacity: 0; }
                100% { transform: scale(1); opacity: 1; }
            }
            .animate-pop {
                animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
        </style>
    </head>
    <body class="text-slate-800 antialiased">
        <div id="root"></div>

        <script type="text/babel">
            const { useState } = React;

            const ECOSYSTEM_ELEMENTS = [
                {
                    id: 'tree',
                    name: 'Stare spróchniałe drzewo',
                    icon: '🪵',
                    category: 'natural',
                    score: 35,
                    residents: ['🦉 Puszczyk i dzięcioł (dziuple)', '🦇 Nietoperze (kryjówka dzienna)', '🪲 Jelonek rogacz (larwy w próchnie)'],
                    desc: 'Stare, martwe drewno tętni życiem! Dziuple i szczeliny kory to bezcenny dom dla ptaków, nietoperzy i pożytecznych chrząszczy.',
                },
                {
                    id: 'nestbox',
                    name: 'Budka lęgowa',
                    icon: '🏠',
                    category: 'natural',
                    score: 30,
                    residents: ['🐦 Sikorka bogatka i modraszka', '🪶 Szpak i muchołówka'],
                    desc: 'Bezpieczne schronienie lęgowe pomaga ptakom wychować pisklęta, które zjadają tysiące gąsienic i komarów.',
                },
                {
                    id: 'puddle',
                    name: 'Kałuża z błotem',
                    icon: '💧',
                    category: 'natural',
                    score: 35,
                    residents: ['🕊️ Jaskółka oknówka (błoto na gniazdo!)', '🐸 Żaba trawna i ważki', '🦋 Motyle (piją minerały z błota)'],
                    desc: 'Kałuża z błotem przyciąga jaskółki, które lepią z niego gniazda, oraz służy jako wodopój dla owadów i ptaków.',
                },
                {
                    id: 'meadow',
                    name: 'Dzika łąka kwietna',
                    icon: '🌼',
                    category: 'natural',
                    score: 35,
                    residents: ['🐝 Pszczoły i trzmiele', '🦋 Paź królowej i rusałki', '🦔 Jeż (poluje w wysokiej trawie)'],
                    desc: 'Niekoszona łąka zatrzymuje wilgoć w glebie, chłodzi otoczenie i karmi dziesiątki gatunków zapylaczy.',
                },
                {
                    id: 'lawn',
                    name: 'Idealnie przystrzyżony trawnik',
                    icon: '⛳',
                    category: 'harmful',
                    score: -15,
                    residents: ['❌ Brak zapylaczy i schronień („zielona pustynia”)'],
                    desc: 'Mit obalony! Sterylny, krótko wykoszony trawnik nie ma kwiatów ani kryjówek — owady i jeże nie znajdują tam pożywienia.',
                },
                {
                    id: 'lamp',
                    name: 'Lampa ogrodowa świecąca całą noc',
                    icon: '💡',
                    category: 'harmful',
                    score: -25,
                    residents: ['⚠️ Odstrasza nietoperze i dezorientuje ćmy'],
                    desc: 'Sztuczne światło w nocy oślepia i odstrasza nietoperze, przyciąga oraz wyczerpuje ćmy, a także zaburza sen ptaków.',
                }
            ];

            function evaluateEcosystem(selectedIds) {
                const selected = selectedIds.map(id => ECOSYSTEM_ELEMENTS.find(el => el.id === id)).filter(Boolean);
                if (selected.length === 0) return null;

                const hasTree = selectedIds.includes('tree');
                const hasNestbox = selectedIds.includes('nestbox');
                const hasPuddle = selectedIds.includes('puddle');
                const hasMeadow = selectedIds.includes('meadow');
                const hasLawn = selectedIds.includes('lawn');
                const hasLamp = selectedIds.includes('lamp');

                let totalScore = selected.reduce((acc, item) => acc + item.score, 0);
                const interactions = [];

                if (hasLamp && (hasTree || hasNestbox)) {
                    interactions.push({
                        type: 'conflict',
                        text: '💡❌🪵 Sztuczne światło lampy świecącej całą noc odstraszyło nietoperze i ćmy, mimo że miały kryjówkę w drzewie/budce!'
                    });
                }
                if (hasLamp && hasMeadow) {
                    interactions.push({
                        type: 'conflict',
                        text: '💡❌🌼 Nocna lampa zaburza rytm dobowy owadów zapylających na łące kwietnej.'
                    });
                }
                if (hasPuddle && (hasNestbox || hasTree)) {
                    totalScore += 15;
                    interactions.push({
                        type: 'synergy',
                        text: '💧✨🏠 Synergia! Kałuża z błotem dostarcza materiału jaskółkom na gniazda, a pobliskie drzewa/budki chronią pisklęta!'
                    });
                }
                if (hasMeadow && hasPuddle) {
                    totalScore += 15;
                    interactions.push({
                        type: 'synergy',
                        text: '🌼✨💧 Synergia! Motyle i pszczoły z łąki kwietnej korzystają z wodopoju i minerałów w kałuży z błotem!'
                    });
                }
                if (hasTree && hasMeadow) {
                    totalScore += 15;
                    interactions.push({
                        type: 'synergy',
                        text: '🪵✨🌼 Synergia! Jeże ukrywają się wśród korzeni starego drzewa i polują nocą na łące kwietnej!'
                    });
                }
                if (hasLawn) {
                    interactions.push({
                        type: 'conflict',
                        text: '⛳⚠️ Idealnie przystrzyżony trawnik działa jak „zielona pustynia” — brak kwiatów i kryjówek ogranicza bioróżnorodność.'
                    });
                }

                const naturalCount = selected.filter(s => s.category === 'natural').length;
                const isPerfect = selected.length === 3 && naturalCount === 3 && !hasLawn && !hasLamp;

                if (isPerfect) {
                    totalScore = 100;
                } else {
                    totalScore = Math.max(0, Math.min(95, totalScore));
                }

                return { selected, totalScore, isPerfect, interactions };
            }

            function App() {
                const [slots, setSlots] = useState([null, null, null]);
                const [report, setReport] = useState(null);

                const handleQuickAdd = (elementId) => {
                    if (slots.includes(elementId)) {
                        setSlots(slots.map(s => (s === elementId ? null : s)));
                        setReport(null);
                        return;
                    }
                    const emptyIdx = slots.indexOf(null);
                    if (emptyIdx !== -1) {
                        const next = [...slots];
                        next[emptyIdx] = elementId;
                        setSlots(next);
                        setReport(null);
                    } else {
                        const next = [...slots];
                        next[2] = elementId;
                        setSlots(next);
                        setReport(null);
                    }
                };

                const handlePlaceInSlot = (slotIdx, elementId) => {
                    const next = [...slots];
                    const existingIdx = next.indexOf(elementId);
                    if (existingIdx !== -1 && existingIdx !== slotIdx) {
                        next[existingIdx] = null;
                    }
                    next[slotIdx] = elementId;
                    setSlots(next);
                    setReport(null);
                };

                const handleCheckResidents = () => {
                    const activeIds = slots.filter(Boolean);
                    const res = evaluateEcosystem(activeIds);
                    setReport(res);
                    if (res && res.isPerfect) {
                        try {
                            const saved = JSON.parse(localStorage.getItem('eko_odkrywcy_progress') || '{}');
                            saved['zadanie-3'] = true;
                            localStorage.setItem('eko_odkrywcy_progress', JSON.stringify(saved));
                        } catch (e) {}
                    }
                };

                const handleResetSlots = () => {
                    setSlots([null, null, null]);
                    setReport(null);
                };

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-white border-b border-emerald-200 sticky top-0 z-40">
                            <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2">
                                <a href="index.html" aria-label="Powrót do menu" className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base shrink-0 transition">
                                    ←
                                </a>
                                <div className="min-w-0 flex-1">
                                    <p className="text-[10px] font-extrabold uppercase tracking-wide text-emerald-700 leading-none mb-1">Zadanie 3 • Karta #3</p>
                                    <h1 className="text-sm sm:text-lg font-black text-slate-900 truncate leading-tight">„Zbuduj Idealny Ekosystem” (Sandbox Przyrodniczy)</h1>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 max-w-6xl w-full mx-auto px-3 py-4 sm:px-4 sm:py-6">
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                <div className="lg:col-span-5 bg-white rounded-3xl p-5 sm:p-6 border-2 border-emerald-200 shadow-sm">
                                    <h2 className="text-xl font-black text-slate-900 mb-1">Elementy środowiska</h2>
                                    <p className="text-xs text-slate-500 mb-4">Kliknij element, aby dodać go do wolnego slotu na swojej działce przyrodniczej.</p>

                                    <div className="grid grid-cols-1 gap-2.5">
                                        {ECOSYSTEM_ELEMENTS.map((el) => {
                                            const isSelected = slots.includes(el.id);
                                            return (
                                                <div
                                                    key={el.id}
                                                    onClick={() => handleQuickAdd(el.id)}
                                                    className={`p-3.5 rounded-2xl border-2 transition cursor-pointer select-none flex items-center justify-between ${
                                                        isSelected
                                                            ? 'bg-emerald-600 text-white border-emerald-700 shadow-md'
                                                            : 'bg-emerald-50/40 hover:bg-emerald-50 border-emerald-200 hover:border-emerald-400'
                                                    }`}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-3xl shrink-0">{el.icon}</span>
                                                        <div>
                                                            <p className="text-sm font-black leading-tight">{el.name}</p>
                                                            <p className={`text-[11px] font-semibold ${isSelected ? 'text-emerald-100' : 'text-slate-500'}`}>
                                                                {el.category === 'natural' ? 'Składnik naturalny' : 'Element antropogeniczny'}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <span className={`text-xs font-extrabold px-2.5 py-1 rounded-full ${isSelected ? 'bg-white text-emerald-800' : 'bg-white text-slate-600 border border-slate-200'}`}>
                                                        {isSelected ? 'W slocie' : '+ Dodaj'}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="lg:col-span-7 flex flex-col gap-6">
                                    <div className="bg-gradient-to-b from-lime-100 via-emerald-100 to-emerald-200 rounded-3xl p-6 border-2 border-emerald-300 shadow-sm">
                                        <div className="flex items-center justify-between mb-4">
                                            <div>
                                                <span className="px-3 py-1 rounded-full bg-white/80 text-emerald-900 text-xs font-extrabold">🌳 Wycinek łąki i skraju lasu (3 sloty)</span>
                                                <h2 className="text-xl font-black text-slate-900 mt-1.5">Ułóż 3 elementy obok siebie</h2>
                                            </div>
                                            <button onClick={handleResetSlots} className="px-3 py-1.5 rounded-xl bg-white/80 hover:bg-white text-slate-700 font-bold text-xs transition">
                                                Wyczyść sloty
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5 mb-5">
                                            {slots.map((slotElementId, idx) => {
                                                const el = ECOSYSTEM_ELEMENTS.find(item => item.id === slotElementId);
                                                return (
                                                    <div
                                                        key={idx}
                                                        onClick={() => el && handlePlaceInSlot(idx, null)}
                                                        className={`min-h-[155px] rounded-2xl p-4 border-3 border-dashed flex flex-col items-center justify-center text-center transition ${
                                                            el ? 'bg-white border-emerald-500 shadow-md cursor-pointer hover:bg-rose-50' : 'bg-white/60 border-emerald-400 text-emerald-900/70'
                                                        }`}
                                                    >
                                                        {el ? (
                                                            <>
                                                                <span className="text-5xl mb-2">{el.icon}</span>
                                                                <p className="text-sm font-black text-slate-900 leading-tight">{el.name}</p>
                                                                <span className="mt-2 text-[10px] font-bold text-slate-400">Kliknij, aby usunąć</span>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <span className="text-2xl mb-1 opacity-60">➕</span>
                                                                <p className="text-xs font-extrabold">Slot {idx + 1}</p>
                                                                <p className="text-[11px]">Wybierz element z listy</p>
                                                            </>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <button
                                            onClick={handleCheckResidents}
                                            disabled={slots.filter(Boolean).length === 0}
                                            className={`w-full py-4 px-6 rounded-2xl font-black text-base shadow-lg transition flex items-center justify-center gap-2 ${
                                                slots.filter(Boolean).length > 0 ? 'bg-emerald-700 hover:bg-emerald-800 text-white cursor-pointer' : 'bg-slate-300 text-slate-500 cursor-not-allowed'
                                            }`}
                                        >
                                            <span>🔍</span>
                                            <span>Sprawdź, kto tu zamieszka</span>
                                        </button>
                                    </div>

                                    {report && (
                                        <div className={`rounded-3xl p-6 border-2 shadow-lg transition-all animate-pop ${report.isPerfect ? 'bg-gradient-to-br from-emerald-600 to-teal-700 text-white border-emerald-300' : 'bg-white text-slate-800 border-emerald-200'}`}>
                                            <div className="flex items-center justify-between mb-4">
                                                <div>
                                                    <span className={`inline-block px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider mb-1 ${report.isPerfect ? 'bg-amber-300 text-emerald-950' : 'bg-emerald-100 text-emerald-800'}`}>
                                                        {report.isPerfect ? '🏆 PERFEKCYJNY EKOSYSTEM!' : '📊 Wynik analizy przyrodniczej'}
                                                    </span>
                                                    <h3 className="text-xl sm:text-2xl font-black">Równowaga przyrodnicza: {report.totalScore} / 100 pkt</h3>
                                                </div>
                                            </div>

                                            {report.interactions.length > 0 && (
                                                <div className="space-y-2 mb-4">
                                                    {report.interactions.map((inter, i) => (
                                                        <div key={i} className={`p-3 rounded-2xl text-xs sm:text-sm font-bold ${report.isPerfect ? 'bg-white/15 text-white' : inter.type === 'synergy' ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'}`}>
                                                            {inter.text}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            <div className="space-y-3">
                                                {report.selected.map((el) => (
                                                    <div key={el.id} className={`p-4 rounded-2xl ${report.isPerfect ? 'bg-white/10 border border-white/20' : 'bg-slate-50 border border-slate-200'}`}>
                                                        <div className="flex items-center gap-2 font-black text-sm mb-1">
                                                            <span className="text-xl">{el.icon}</span>
                                                            <span>{el.name}</span>
                                                        </div>
                                                        <p className={`text-xs mb-2 ${report.isPerfect ? 'text-emerald-100' : 'text-slate-600'}`}>{el.desc}</p>
                                                        <div className="flex flex-wrap gap-1.5">
                                                            {el.residents.map((res, rIdx) => (
                                                                <span key={rIdx} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${report.isPerfect ? 'bg-emerald-950/40 text-emerald-100' : 'bg-white border border-slate-200 text-slate-800'}`}>
                                                                    {res}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
    </body>
</html>
